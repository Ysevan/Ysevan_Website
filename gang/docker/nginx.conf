pid /tmp/nginx.pid;

events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr notice;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  server_tokens off;

  # 站点从头到尾是中文，且 .js 里内联着整本手册的正文。mime.types 给 .css/.js 的类型不带 charset，
  # 浏览器只能靠"外链脚本继承文档编码"这条兜底规则猜对 UTF-8——能work但很脆。显式声明掉。
  # 注意 charset_types 必须写全：nginx 默认表里是 application/javascript，而 1.21 起 mime.types
  # 把 .js 映射成 text/javascript，且 text/css 本来就不在默认表里，只写 charset 会漏掉这两类。
  # （text/html 不用写，nginx 对 charset_types / gzip_types 都是隐式恒含，显式再写反而触发重复告警。）
  charset utf-8;
  charset_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;

  # 未压缩时 employee-handbook.js 265KB + app.js 156KB + styles.css 80KB，柜面网络下这半兆很肉疼。
  # 图片（jpeg/png）已是压缩格式，不进 gzip_types。
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
      access_log off;
      return 204;
    }

    location = /index.html {
      add_header Cache-Control "no-cache, must-revalidate" always;
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ =404;
    }

    location ~ /\. {
      deny all;
    }
  }
}
