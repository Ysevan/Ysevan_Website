version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "offline"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Shanghai"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "offline"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Asia/Shanghai"
