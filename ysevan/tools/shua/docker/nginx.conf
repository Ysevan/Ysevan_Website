worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  charset utf-8;
  charset_types text/html text/css text/plain text/javascript application/javascript application/manifest+json;

  access_log /dev/stdout;
  error_log /dev/stderr notice;

  # 容器以非 root 的 nginx 用户运行，所有可写路径必须落在 /tmp。
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  tcp_nopush on;
  server_tokens off;

  # 六个题库脚本合计约 2.4 MB，未压缩时首次装载和 Service Worker 预缓存都很重。
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

  # Service Worker 和入口 HTML 必须每次重验证，否则会把旧离线壳再缓存一层。
  # 用 map 集中判定，避免在 location 里写 add_header 而清空 server 级的安全响应头。
  map $uri $shua_cache_control {
    default       "no-cache";
    "/"           "no-cache, must-revalidate";
    "/index.html" "no-cache, must-revalidate";
    "/sw.js"      "no-cache, no-store, must-revalidate";
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 与本机 serve.mjs / serve.ps1 保持同一套安全响应头和禁止索引声明。
    add_header Cache-Control $shua_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    location = /healthz {
      access_log off;
      return 204;
    }

    location / {
      try_files $uri $uri/ =404;
    }

    location ~ /\. {
      deny all;
    }
  }
}
