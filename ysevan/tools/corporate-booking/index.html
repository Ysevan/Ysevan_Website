<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>对公业务预约</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #282826;
      background: #f8f8f6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; align-items: center; }
    main { width: min(100%, 34rem); margin: 0 auto; padding: 3.5rem clamp(1.5rem, 6vw, 3.5rem); }
    h1 { margin: 0 0 1rem; font-size: clamp(2rem, 5vw, 2.75rem); font-weight: 650; line-height: 1.25; }
    p { margin: 0; color: #565754; line-height: 1.7; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 2.875rem;
      margin-top: 2rem;
      padding: .6rem 1.35rem;
      border: 1px solid #cececa;
      border-radius: .75rem;
      color: inherit;
      font-weight: 550;
      text-decoration: none;
    }
    a:hover { background: #efefec; }
    a:focus-visible { outline: 3px solid #706b82; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>对公业务预约</h1>
    <p>线上预约暂未开放。</p>
    <a href="../../../index.html">返回旧站首页</a>
  </main>
</body>
</html>
