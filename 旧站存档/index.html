<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ysevan | 旧站存档</title>
<style>
/* 旧站存档（2026-09-27）：书生子白四页和游戏中心删掉以后，这些旧页从首页进来的总入口。
   版式、配色、卡片和按压倾斜整套照搬「网站素材」总览页（网站素材/index.html），改那边的样式时这边一起改。
   排版参照「Ysevan的小屋」（Ysevan_web/docs/xiaowu-ui-spec.md §2–§3、冻结小样的工具卡 .cd）：
   暖纸底 + 橄榄墨、行楷标题、宋体名称、黑体正文；饱和色不用；夜里是同一间屋子的夜色。 */
:root {
  --paper: #F8F6F1;
  --haze-warm: #F2EDE2;
  --haze-cool: #E9EEEC;
  --grey: #EDEAE3;
  --card: #FDFCF9;
  --card-line: #E8E4DA;
  --line: #E4E0D6;
  --divider: #DDD9CD;
  --olive: #5E6144;
  --olive-deep: #4A4D35;
  --olive-2: #8B8C6D;
  --olive-tint: #E1E0CE;
  --ink: #2E2D28;
  --ink-body: #3E3C35;
  --ink-2: #6C6A61;
  --ink-3: #6B685B;
  --nav-bg: rgba(248, 246, 241, .82);
  --shadow: 0 1px 2px rgba(74, 77, 53, .05), 0 8px 20px -10px rgba(74, 77, 53, .11);
  --shadow-hover: 0 1px 2px rgba(74, 77, 53, .06), 0 14px 28px -14px rgba(74, 77, 53, .2);
  --navh: 66px;
  --glow: rgba(233, 208, 150, .34);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #15171B;
    --haze-warm: #231F18;
    --haze-cool: #1A1D23;
    --grey: #24272D;
    --card: #1D2025;
    --card-line: #353941;
    --line: #353941;
    --divider: #353941;
    --olive: #CCBC8F;
    --olive-deep: #E2D8B8;
    --olive-2: #A69D82;
    --olive-tint: #2E3138;
    --ink: #E7E1D0;
    --ink-body: #DED9C9;
    --ink-2: #ACA69A;
    --ink-3: #9F9A8E;
    --nav-bg: rgba(21, 23, 27, .82);
    --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 8px 20px -10px rgba(0, 0, 0, .5);
    --shadow-hover: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 28px -14px rgba(0, 0, 0, .6);
    --glow: rgba(204, 188, 143, .16);
  }
}

* { box-sizing: border-box; }
p, h1, h2, h3, h4 { margin: 0; }
html { scroll-padding-top: calc(var(--navh) + 12px); }
body {
  margin: 0;
  background:
    radial-gradient(1020px 600px at 88% -14%, var(--haze-warm) 0%, transparent 62%),
    radial-gradient(760px 520px at 2% 106%, var(--haze-cool) 0%, transparent 58%),
    var(--paper);
  background-attachment: fixed;
  color: var(--ink-body);
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 15px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--olive); outline-offset: 4px; border-radius: 4px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 32px); }

/* 顶栏：半透明纸 + 模糊，滚动后出一条发丝线 */
.nav {
  position: sticky; top: 0; z-index: 40;
  min-height: var(--navh);
  display: flex; align-items: center;
  background: var(--nav-bg);
  -webkit-backdrop-filter: saturate(1.35) blur(12px);
  backdrop-filter: saturate(1.35) blur(12px);
  border-bottom: 1px solid transparent;
  transition: border-color .3s ease;
}
.nav.is-stuck { border-bottom-color: var(--line); }
.nav .wrap { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: clamp(16px, 3vw, 32px); }
.mark { font-size: 15px; color: var(--ink); text-decoration: none; white-space: nowrap; }
.mark:hover { color: var(--olive-deep); }
.links { display: flex; gap: clamp(16px, 2.4vw, 30px); }
.links a {
  color: var(--ink-2); text-decoration: none; font-size: 14.5px; white-space: nowrap;
  padding-bottom: 3px; box-shadow: inset 0 -2px 0 transparent;
  transition: color .25s ease, box-shadow .25s ease;
}
.links a:hover { color: var(--olive-deep); }
.links a.is-here { color: var(--olive-deep); box-shadow: inset 0 -2px 0 var(--olive-2); }

/* 页头：行楷标题 + 一句话 + 件数 */
.page { padding-top: clamp(28px, 3.4vw, 44px); padding-bottom: clamp(40px, 5vw, 64px); }
.head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px clamp(12px, 1.8vw, 20px); }
.head__l { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px clamp(12px, 1.8vw, 20px); }
.head h1 {
  font-family: "Xingkai SC", "STXingkai", "华文行楷", "Kaiti SC", "STKaiti", "KaiTi", serif;
  font-size: clamp(30px, 3vw, 38px); font-weight: 400; color: var(--ink); letter-spacing: .05em;
}
.head__l span { font-size: 14.5px; color: var(--ink-2); }
.head__n { font-size: 12px; letter-spacing: .14em; color: var(--ink-3); white-space: nowrap; }
.head__n b { font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

/* 每个大类一块灰毯，卡片放在毯子上 */
.rug {
  margin-top: clamp(26px, 3vw, 38px);
  background: var(--grey);
  border-radius: clamp(22px, 2.6vw, 30px);
  padding: clamp(24px, 3.4vw, 42px) clamp(16px, 3.4vw, 44px) clamp(22px, 2.6vw, 34px);
}
.rug__head { display: flex; align-items: baseline; gap: 12px; margin-bottom: clamp(16px, 2vw, 22px); }
.rug__head h2 {
  font-family: "Songti SC", "STSong", "SimSun", serif;
  font-size: clamp(21px, 2vw, 25px); font-weight: 600; color: var(--ink); letter-spacing: .05em;
}
.rug__head span { font-size: 12px; letter-spacing: .14em; color: var(--ink-3); }
.sub { margin: clamp(20px, 2.4vw, 28px) 0 12px; font-size: 12px; letter-spacing: .16em; color: var(--ink-3); }
.rug__head + .sub { margin-top: 0; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: clamp(12px, 1.6vw, 18px); }

/* 卡片：沿用小屋工具卡 .cd 的纸、边、双层阴影和分区次序 */
.cd {
  display: flex; flex-direction: column; min-width: 0;
  background: var(--card); border: 1px solid var(--card-line);
  border-radius: clamp(14px, 1.6vw, 18px);
  padding: clamp(16px, 1.8vw, 20px) clamp(16px, 1.8vw, 20px) clamp(14px, 1.6vw, 18px);
  box-shadow: var(--shadow);
  text-decoration: none; color: inherit;
  /* 按压倾斜（2026-09-27）：位移、倾斜、缩放都经这几个变量进同一个 transform，动画只动 transform 和 opacity */
  position: relative; overflow: hidden; isolation: isolate;
  --lift: 0px; --rx: 0deg; --ry: 0deg; --s: 1;
  --gx: 0px; --gy: 0px;   /* 柔光相对卡片中心的偏移 */
  transform: perspective(800px) translateY(var(--lift)) rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--s));
  transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  -webkit-tap-highlight-color: transparent;
}
a.cd:hover { --lift: -2px; box-shadow: var(--shadow-hover); border-color: var(--olive-2); }
/* 纸面上的柔光：平时摊开、看不见；按下时从四周聚拢到触点，松手再散开淡掉 */
a.cd::before {
  content: ""; position: absolute; z-index: -1; left: 50%; top: 50%;
  width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%;
  background: radial-gradient(closest-side, var(--glow), transparent);
  pointer-events: none;
  transform: translate(var(--gx), var(--gy)) scale(1.9);
  opacity: 0;
  transition: transform .45s ease, opacity .45s ease;
}
a.cd.is-pressed { --lift: 0px; transition: transform .16s cubic-bezier(.2, .7, .3, 1), box-shadow .25s ease, border-color .25s ease; }
a.cd.is-pressed::before { transform: translate(var(--gx), var(--gy)) scale(1); opacity: 1; transition: transform .22s cubic-bezier(.2, .7, .3, 1), opacity .16s ease-out; }
a.cd.is-releasing { transition: transform .6s cubic-bezier(.34, 1.56, .64, 1), box-shadow .25s ease, border-color .25s ease; }
.cd__top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.cd__no { font-size: 11.5px; letter-spacing: .14em; color: var(--ink-3); font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.cd__kind { font-size: 11.5px; letter-spacing: .06em; color: var(--ink-3); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cd__name {
  margin-top: 6px;
  font-family: "Songti SC", "STSong", "SimSun", serif;
  font-size: 19px; font-weight: 600; color: var(--ink); letter-spacing: .05em; line-height: 1.35;
}
.cd__say { flex: 1 1 auto; margin-top: 8px; font-size: 13.5px; line-height: 1.85; color: var(--ink-body); }
.cd__for { margin-top: 12px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 8px; font-size: 12.5px; }
.pill { color: var(--olive-deep); background: var(--olive-tint); border-radius: 999px; padding: 1px 9px; font-size: 11.5px; white-space: nowrap; }
.pill--line { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--divider); }
.cd__who { color: var(--ink-2); }
.cd__foot {
  margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--divider);
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
}
.cd__tags { display: flex; flex-wrap: wrap; gap: 6px; }
.cd__open { font-size: 12.5px; color: var(--olive-deep); white-space: nowrap; }
a.cd:hover .cd__open { text-decoration: underline; text-underline-offset: 3px; }
.cd__open--off { color: var(--ink-3); }

@media (max-width: 560px) {
  .mark { font-size: 13.5px; }
  .links a { font-size: 13.5px; }
  .links { gap: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .cd, .links a, .nav { transition: none; }
  .cd, a.cd:hover, a.cd.is-pressed, a.cd.is-releasing { transform: none; transition: none; }
  /* 减弱动效：卡片不动，柔光只在触点处淡入淡出 */
  a.cd::before, a.cd.is-pressed::before { transform: translate(var(--gx), var(--gy)); transition: opacity .2s linear; }
}
</style>
</head>
<body>
<nav class="nav" id="nav">
  <div class="wrap">
    <a class="mark" href="../index.html">← 主页</a>
    <div class="links" id="links"></div>
  </div>
</nav>

<main class="page wrap">
  <header>
    <div class="head">
      <div class="head__l">
        <h1>旧站存档</h1>
        <span>早年做过的个人站和旧页面，原样留着</span>
      </div>
      <div class="head__n">共 <b id="total">0</b> 页</div>
    </div>
  </header>
  <div id="main"></div>
</main>

<script>
// 每一项：[名称, 路径（相对本页）, 一句话是什么, 年份, 原来从哪进（原入口）]。只收 old 里现有的页面，不新写内容
var DATA = [
  { cat: "书生子白", id: "szb", note: "2021–2022", groups: [
    { title: "", items: [
      ["Blog2", "../Blog/Blog2/Blog2.html", "Hipster Cards 卡片风的博客页；卡片上的按钮能进压扁小鸟、心跳6 两个小游戏", "2022", "书生子白的 Blog 页"],
      ["MIKU的避风港", "../Blog/miku1/miku.html", "初音未来主题的子站，放着跨年烟花、绘制银河、图片立方体轮播三个特效", "2021–2022", "ACGN 页的 MIKU 横条"],
      ["高一二班回忆录", "../Blog/2class/index.html", "高一（2）班的班级博客，记的是 2019 年 8 月到 2020 年 7 月的高一", "2020", "Explore 页的友链"]
    ]}
  ]},
  { cat: "EV's world", id: "ev", note: "2021", groups: [
    { title: "", items: [
      ["Explore", "../EVa/2021-EVs-world/Explore/Explore.html", "第一个个人站（2021-08-29 建，当时的域名是 evyan.top）的探索页：友链，还能进 EV 版的 blog 和 MIKU 子站", "2021", "evyan.top 的导航栏"],
      ["Blog", "../EVa/2021-EVs-world/Blog/index Blog.html", "EV's world 的博客页，也是 Hipster Cards 卡片风，卡片按钮进压扁小鸟、心跳6", "2021", "evyan.top 的导航栏"],
      ["ACGN", "../EVa/2021-EVs-world/ACGN/index ACGN.html", "EV's world 的二次元页；页上的 MIKU 横条在这份存档里指不到地方，MIKU 子站从 Explore 进", "2021", "evyan.top 的导航栏"]
    ]}
  ]},
  { cat: "其他", id: "misc", note: "", groups: [
    { title: "", items: [
      ["404 页", "../404.html", "三体文案加一个小恐龙跳跃游戏；网站上找不到页面时显示的就是它", "年份不详", "找不到页面时自动显示"]
    ]}
  ]}
];

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

var main = document.getElementById("main");
var links = document.getElementById("links");
var total = 0;

DATA.forEach(function (section) {
  var count = 0, no = 0;
  section.groups.forEach(function (g) { count += g.items.length; });
  total += count;

  var nav = el("a", null, section.cat);
  nav.href = "#" + section.id;
  nav.dataset.target = section.id;
  links.appendChild(nav);

  var rug = el("section", "rug");
  rug.id = section.id;
  var head = el("div", "rug__head");
  head.appendChild(el("h2", null, section.cat));
  head.appendChild(el("span", null, (section.note ? section.note + " · " : "") + count + "页"));
  rug.appendChild(head);

  section.groups.forEach(function (g) {
    if (g.title) rug.appendChild(el("h3", "sub", g.title));
    var grid = el("div", "grid");
    g.items.forEach(function (it) {
      no++;
      var name = it[0], path = it[1], say = it[2], year = it[3], from = it[4];
      var card = el("a", "cd");
      card.href = encodeURI(path); card.target = "_blank"; card.rel = "noopener";

      var top = el("div", "cd__top");
      top.appendChild(el("span", "cd__no", (no < 10 ? "0" : "") + no));
      top.appendChild(el("span", "cd__kind", year));
      card.appendChild(top);
      card.appendChild(el("h4", "cd__name", name));
      card.appendChild(el("p", "cd__say", say));

      var forRow = el("div", "cd__for");
      forRow.appendChild(el("span", "pill", "原入口"));
      forRow.appendChild(el("span", "cd__who", from));
      card.appendChild(forRow);

      var foot = el("div", "cd__foot");
      foot.appendChild(el("div", "cd__tags"));
      foot.appendChild(el("span", "cd__open", "打开 →"));
      card.appendChild(foot);
      grid.appendChild(card);
    });
    rug.appendChild(grid);
  });
  main.appendChild(rug);
});
document.getElementById("total").textContent = total;

// 顶栏：滚动后出发丝线；当前所在的大类在导航里标下划线
var navEl = document.getElementById("nav");
function onScroll() { navEl.classList.toggle("is-stuck", window.scrollY > 4); }
window.addEventListener("scroll", onScroll, { passive: true });
onScroll();
if ("IntersectionObserver" in window) {
  var navLinks = links.querySelectorAll("a");
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      navLinks.forEach(function (a) { a.classList.toggle("is-here", a.dataset.target === e.target.id); });
    });
  }, { rootMargin: "-40% 0px -55% 0px" });
  DATA.forEach(function (s) { io.observe(document.getElementById(s.id)); });
}

// 按压倾斜卡片（2026-09-27）：按下时朝触点方向轻微倾斜、缩小一点，背后的柔光聚拢到触点；松手弹性复原。
// 鼠标、触屏（Pointer Events）和键盘（回车 / 空格）都能触发；键盘按下时按在卡片正中。
// 减弱动效：只让柔光在触点淡入淡出，卡片不倾斜不缩放（CSS 那边也兜着）。
(function () {
  var MAX_TILT = 5;      // 度
  var PRESS_SCALE = 0.975;
  var reduce = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };

  function aim(card, x, y) {
    var r = card.getBoundingClientRect();
    // 用未变形的尺寸算：按下后 transform 会让 getBoundingClientRect 变小一点，这里只要比例
    var w = card.offsetWidth || r.width, h = card.offsetHeight || r.height;
    var px = Math.min(Math.max((x - r.left) / r.width, 0), 1);
    var py = Math.min(Math.max((y - r.top) / r.height, 0), 1);
    card.style.setProperty("--gx", ((px - 0.5) * w).toFixed(1) + "px");
    card.style.setProperty("--gy", ((py - 0.5) * h).toFixed(1) + "px");
    if (reduce.matches) return;
    // 触点那一侧往里压：右边按下 → 右边后退（rotateY 为正），上边按下 → 上边后退（rotateX 为正）。
    // 正负号是量出来的（验收探针把四角按 transform 投影、比左右边高），别凭直觉改
    card.style.setProperty("--ry", ((px - 0.5) * 2 * MAX_TILT).toFixed(2) + "deg");
    card.style.setProperty("--rx", ((0.5 - py) * 2 * MAX_TILT).toFixed(2) + "deg");
    card.style.setProperty("--s", String(PRESS_SCALE));
  }

  function press(card, x, y) {
    card.classList.remove("is-releasing");
    card.classList.add("is-pressed");
    if (x == null) {
      var r = card.getBoundingClientRect();
      x = r.left + r.width / 2; y = r.top + r.height / 2;
    }
    aim(card, x, y);
  }

  function release(card) {
    if (!card.classList.contains("is-pressed")) return;
    card.classList.remove("is-pressed");
    card.classList.add("is-releasing");
    card.style.setProperty("--rx", "0deg");
    card.style.setProperty("--ry", "0deg");
    card.style.setProperty("--s", "1");
  }

  document.querySelectorAll("a.cd").forEach(function (card) {
    var pointer = null, raf = 0, last = null;
    card.addEventListener("pointerdown", function (ev) {
      if (ev.pointerType === "mouse" && ev.button !== 0) return;
      pointer = ev.pointerId;
      press(card, ev.clientX, ev.clientY);
    });
    card.addEventListener("pointermove", function (ev) {
      if (ev.pointerId !== pointer) return;
      last = ev;
      if (!raf) raf = requestAnimationFrame(function () { raf = 0; if (pointer != null && last) aim(card, last.clientX, last.clientY); });
    });
    function end(ev) {
      if (ev && ev.pointerId !== pointer) return;
      pointer = null; last = null;
      release(card);
    }
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", end);   // 触屏上开始滚动页面时浏览器会发这个
    card.addEventListener("pointerleave", end);
    card.addEventListener("keydown", function (ev) {
      if (ev.isComposing || ev.keyCode === 229 || ev.repeat) return;
      if (ev.key === "Enter" || ev.key === " ") {
        if (ev.key === " ") ev.preventDefault();   // 空格别滚页面；松开时当点击
        press(card);
      }
    });
    card.addEventListener("keyup", function (ev) {
      if (ev.key !== "Enter" && ev.key !== " ") return;
      var was = card.classList.contains("is-pressed");
      release(card);
      if (ev.key === " " && was) card.click();
    });
    card.addEventListener("blur", function () { release(card); });
    card.addEventListener("transitionend", function (ev) {
      if (ev.target === card && ev.propertyName === "transform") card.classList.remove("is-releasing");
    });
  });
})();
</script>
</body>
</html>
