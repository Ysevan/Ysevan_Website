name: Private image and deploy

on:
  push:
    branches: [offline]
  # PR 上也跑 verify。此前只在 push 到 offline 时触发，于是 dependabot 提的
  # 基础镜像/依赖升级一次都没被验证过——合进来才知道坏没坏，等于盲飞。
  # publish 与 deploy 两个 job 在 PR 上会被跳过，见它们各自的 if。
  pull_request:
    branches: [offline]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-shua
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/ysevan/ysevan-shua
  IMAGE_REF: ghcr.io/ysevan/ysevan-shua:sha-${{ github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a private source repository
        env:
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
        run: test "$REPOSITORY_IS_PRIVATE" = "true"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0

      - name: Check JavaScript syntax
        run: |
          node --check theme.js
          node --check app.js
          node --check project.js
          node --check sw.js
          node --check effects.js
          node --check effects-3d.bundle.js
          node --check vendor/xlsx-import.js
          node --check vendor/lucide.min.js
          for file in *-questions.js questions.js annual-inspection-2026-comparison.js; do node --check "$file"; done

      # 新题库要同时进 index.html、sw.js、Dockerfile 三处，stats.json 要和题库文件一致。
      # 3.9.0 起外汇2026 漏进 Dockerfile，容器里 404 导致 Service Worker 装不上，两周没人发现。
      - name: Release consistency (Dockerfile / sw.js coverage, stats.json)
        run: node scripts/release-check.mjs --check

      # 基础镜像或构建相关的改动，只有真构建一次才验得到。PR 上不登录 registry、
      # 不推送，纯粹验证 Dockerfile 能不能构建出来。
      - name: Setup Docker Buildx
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the image without pushing
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          cache-from: type=gha

  publish:
    # PR 上只验证，不发布：dependabot 的 token 是只读的，而且未审核的分支
    # 绝不能把镜像推进私有 GHCR。
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse to publish over a public package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/${{ github.repository_owner }}/packages/container/ysevan-shua")"
          case "$status" in
            404) ;;
            200) test "$(jq -r .visibility "$response_file")" = "private" ;;
            *) echo "无法确认 GHCR 包私有性（HTTP $status）" >&2; exit 1 ;;
          esac

      - name: Login to the private GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push immutable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REF }}
            ${{ env.IMAGE_NAME }}:offline
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Block images with known fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Verify that the GHCR package is private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: test "$(gh api /users/${{ github.repository_owner }}/packages/container/ysevan-shua --jq .visibility)" = "private"

  deploy:
    if: ${{ github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true' }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/deploy_key"

      - name: Deploy the verified image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/ysevan-deploy shua '${{ env.IMAGE_REF }}'"
